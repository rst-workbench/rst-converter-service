name: rst-converter-service CI

on:
  push:
    branches: [master]
    tags: ['*']
  pull_request:

permissions:
  contents: read

jobs:

  test:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: "Build Docker image"
      run: docker build -t rst-converter-service .
    - name: "Show Python dependencies"
      run: docker run --entrypoint=pip rst-converter-service freeze
    - name: "Run pytest with coverage.py in Docker"
      run: docker run --entrypoint=pytest rst-converter-service --cov=rstconverter
    - name: "Smoke test: start service and query /output-formats"
      run: |
        docker run -d --name rst-converter-service -p 5000:5000 rst-converter-service
        for i in $(seq 1 30); do
          if curl -sf http://localhost:5000/output-formats > response.json; then
            cat response.json
            grep -q 'rs3' response.json && exit 0
          fi
          sleep 1
        done
        echo "service did not become healthy in time" >&2
        exit 1

  push:

    if: github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
    - uses: actions/checkout@v4
    - uses: docker/setup-buildx-action@v3
    - uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - uses: docker/metadata-action@v5
      id: meta
      with:
        images: ghcr.io/${{ github.repository }}
        tags: |
          type=raw,value=latest,enable={{is_default_branch}}
          type=ref,event=tag
          type=sha
    - uses: docker/build-push-action@v6
      with:
        context: .
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
